<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff5df"><title>Vamos aprender os ditongos!</title><link rel="stylesheet" href="css/style.css"></head><body><div class="layout"><aside id="sidebar" class="sidebar"><h2>Ditongos</h2><nav id="filters"></nav><p class="sidehint">Escolhe o ditongo para praticar.</p></aside><main><header><div class="mascot">🦉</div><h1>Vamos aprender os ditongos!</h1><p>Olha para a imagem. Que letras faltam?</p><button id="menuToggle" class="menu">☰ Ditongos</button></header><section class="toolbar"><span id="filterLabel">Todos</span><button id="shuffle" class="button purple">🔀 Baralhar</button></section><section class="card" aria-live="polite"><img id="picture" src="images/cao.svg" alt="Imagem da palavra"><div id="prompt" class="prompt">C__</div><div id="answer" class="answer"></div></section><section class="vowel-panel"><div id="vowels" class="vowels"></div><div class="vowel-actions"><button id="erase" class="button secondary">⌫ Apagar</button><button id="clear" class="button secondary">↺ Limpar</button><button id="check" class="button green">✓ Verificar</button></div></section><div class="buttons"><button id="prev" class="button secondary">← Anterior</button><button id="reveal" class="button primary">✨ Mostrar!</button><button id="speak" class="button green">🔊 Ouvir</button><button id="next" class="button pink">Seguinte →</button></div><div id="count" class="count"></div><footer>Para substituir imagens ou gravações, troca os ficheiros nas pastas images/ e audio/ 🌈</footer></main></div><script src="js/app.js"></script></body></html>
